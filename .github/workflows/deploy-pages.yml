name: Publish Kodi repository

# Builds the repository, publishes it to GitHub Pages, and posts the new version
# as a GitHub Release.
#
# WHY RELEASES HOLD THE OLD VERSIONS
# Kodi shows every version it finds under zips/<addon id>/, so the published
# site has to carry the whole history, not just the newest build. Committing
# those ZIPs would put roughly 200 MB into git for versions that each existed
# for minutes, and every future release would add another 15 MB to the history
# for ever. Release assets do not live in git, so the checkout stays small while
# the site still offers every version: this workflow downloads the assets from
# previous releases and lays them out alongside the fresh build before
# publishing.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  # Republish without a code change, e.g. after deleting a bad release.
  workflow_dispatch:
  workflow_dispatch:

permissions:
  contents: write      # needed to create the release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # a cancelled deploy can leave Pages half-updated

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: deciding whether users need a new version
          # means comparing against the last release, which a shallow clone
          # does not have.
          fetch-depth: 0

      - name: Decide the version
        id: version
        # Kodi only updates when the repository advertises a HIGHER version, so
        # a push that changes the add-on without raising it would publish and
        # reach nobody. tools/release_version.py bumps the patch number in that
        # case and fills Kodi's "what's new" from the commit log.
        run: |
          python3 tools/release_version.py | tee -a "$GITHUB_OUTPUT"

      - name: Commit the version bump back
        if: steps.version.outputs.bumped == 'true'
        # So the repository always matches what was published. A push made with
        # GITHUB_TOKEN does not start another workflow run, so this cannot
        # loop; [skip ci] is there for anyone reading the history.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.version.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fetch every previously released ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Kodi lists whatever is in zips/<id>/, so the old builds have to be
          # present or the version list collapses to one entry after every push.
          mkdir -p dist/zips
          gh release list --limit 200 --json tagName --jq '.[].tagName' > tags.txt || true
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release download "$tag" --dir /tmp/assets --pattern '*.zip' --clobber || continue
          done < tags.txt
          shopt -s nullglob
          for zip in /tmp/assets/*.zip; do
            id="$(basename "$zip" | sed -E 's/-[0-9]+(\.[0-9]+)*\.zip$//')"
            mkdir -p "dist/zips/$id"
            cp -n "$zip" "dist/zips/$id/"
          done
          echo "Carried forward $(find dist/zips -name '*.zip' | wc -l) archived ZIPs"

      - name: Build the repository
        env:
          # The TMDb and Trakt keys are baked into the published add-on so the
          # catalogue works the moment someone installs it. They live as
          # repository secrets, never in git; build.py reads GRNSHOWS_* from the
          # environment.
          GRNSHOWS_TMDB_API_KEY: ${{ secrets.GRNSHOWS_TMDB_API_KEY }}
          GRNSHOWS_TRAKT_CLIENT_ID: ${{ secrets.GRNSHOWS_TRAKT_CLIENT_ID }}
          GRNSHOWS_TRAKT_CLIENT_SECRET: ${{ secrets.GRNSHOWS_TRAKT_CLIENT_SECRET }}
        run: |
          # The Pages URL is derived from the repository itself, so nothing here
          # has to be edited when the owner or the repository name changes.
          repo_name="${GITHUB_REPOSITORY#*/}"
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          if [ "$repo_name" != "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            base_url="$base_url/$repo_name"
          fi
          echo "Repository URL for Kodi: $base_url"
          python3 build.py --base-url "$base_url"

      - name: Check the build advertises what it serves
        run: python3 -m unittest discover -s tests -q

      - name: Refuse a build users could not use
        # Both failures this catches are silent otherwise: a build with no keys
        # succeeds and ships an add-on with a dead catalogue, and a build Kodi
        # cannot browse deploys fine while every new install stops at step one.
        run: python3 tools/verify_build.py dist

      - name: Post the release
        id: release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released; leaving it alone"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the ZIPs built from this commit, so a release always matches
          # the source it was cut from.
          assets=$(find dist/zips -name "*-${{ steps.version.outputs.version }}.zip")
          gh release create "$tag" $assets \
            --title "GRN Shows ${{ steps.version.outputs.version }}" \
            --notes "Installed automatically by Kodi from the GRN Shows repository.

          Repository URL: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
